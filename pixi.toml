[workspace]
name = "venmo-mcp"
version = "0.1.0"
description = "Venmo MCP server for Claude Code"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[dependencies]
python = "==3.14.3"
pip = "==26.0.1"
pytest = ">=9.0.3,<10"

[pypi-dependencies]
venmo-api = "==0.3.1"
mcp = "==1.26.0"

[tasks]
serve = "python server.py"
auth = "python auth.py"
test = "pytest -q"
